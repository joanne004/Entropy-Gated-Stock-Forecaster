# instead of installing and configuring all the dependencies on your local machine, 
# you can use docker-compose to run the ETL pipeline in a containerized environment. 
# This will ensure that all dependencies are properly installed and configured, 
# and will also make it easier to deploy the pipeline to different environments.
services:

#-------------------Zookeeper-------------------#
  zookeeper: # is necessary for running Kafka, as it manages the Kafka brokers(kafka servers, in our instance we've got only one server) and keeps track of their state.
    image: confluentinc/cp-zookeeper:7.5.0 # prepackaged program that manages distributed systems and provides coordination services for Kafka
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181" # map the container's port 2181 to the host machine's port 2181
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5


#----------------Kafka-------------------#
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on: # tells docker to wait on zookeeper to pass its healthcheck to start running kafka container
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # tells kafka where Zookeeper is
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092  
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092 # tells kafka to listen on the specified ports for incoming connections. The first listener is for internal communication between containers and the second listener is for external communication this is what the python scripts will use
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # kafka normallyy replicates data across multiple brokers for safety. Since we have only one broker we set this to 1(no replication needed)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # instead of manually creating topics before sending messages, Kafka will create them automatically the first time a producer sends to them
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5



#--------------MinIO----------------------#
  minio: # is a file storage system. You create buckets(like folders) and store files in them
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # the API port. The python scripts will use this to upload/download files
      - "9001:9001" #the browser console. visual like a file explorer to see buckets and files
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001" # this is the command that runs when the container starts. it starts MinIO in server mode and stores files in /data, and enables the browser console on port 9001
    volumes:
      - minio_data:/data # tells Docker to save files in /data to a volume called minio_data. This is important because if we don't do this, the files will be lost when the container is stopped or removed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5


#-------------------PostgreSQL-------------------#
  postgres:
    image: postgres:15
    container_name: postgres
    environment: # the python script connects using these values
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: stockpass
      POSTGRES_DB: stockdb
    ports:
      - "5432:5432" # the python code connects to localhost: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data # tells Docker to save the database data to a volume called postgres_data. This is important because if we don't do this, the data will be lost when the container is stopped or removed
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh # this is a script that runs when the container starts. It creates the tables and inserts the initial data into the database. The script is mounted to the container at /docker-entrypoint-initdb.d/init-db.sh, which is a special directory that Postgres looks for scripts to run when it starts up.
    healthcheck: # this is a command that checks if the database is ready to accept connections. It runs the pg_isready command, which checks if the database is accepting connections. If the command returns 0, the database is ready. If it returns 1, the database is not ready. If it returns 2, the database is not running.
      test: ["CMD-SHELL", "pg_isready -U stockuser -d stockdb"]
      interval: 10s
      timeout: 5s
      retries: 5



#-------------------pgAdmin-------------------#
  pgadmin: # browser based UI for PostgreSQL. It allows you to view the database structure, run queries, and manage the database. It is not necessary for the ETL pipeline to run, but it is useful for debugging and monitoring the database.
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stock.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"


#------------------Airflow-------------------#
  airflow: # it is a scheduler that run the ETL pipeline automaatically on a schedule. Airflow reads the DAG (Directed Acyclic Graph that says run these steps  in this order at this time every day)
    image: apache/airflow:2.8.0
    container_name: airflow
    depends_on: # airflow stores its own state( which DAGs ran, did they succeed) in airflow.db so it needs Postgres to be running before it starts.
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://stockuser:stockpass@postgres/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: stock-prediction-secret-2024
      POSTGRES_HOST: postgres
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags # mounts the dags folder in your local computer to the container at /opt/airflow/dags 
      - ./:/opt/airflow/scripts # mounts everything in etl_pipeline at /opt/airflow/scripts. The "." here means the current directory
      - airflow_logs:/opt/airflow/logs
    command: bash -c "airflow scheduler & exec airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5




volumes:
  minio_data:
  postgres_data:
  airflow_logs: